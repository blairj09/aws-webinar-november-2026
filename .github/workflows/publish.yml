# Render the site (landing page, deck, security guide) and publish it to the
# gh-pages branch, which GitHub Pages serves. Runs on every push to main.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # The publish profile writes to _site and turns off the review overlay.
      QUARTO_PROFILE: publish
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9

      - name: Render
        run: quarto render

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
