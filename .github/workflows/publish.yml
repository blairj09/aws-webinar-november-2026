# Render the site (landing page, deck, security guide) and publish it to the
# gh-pages branch, which GitHub Pages serves. Runs on every push to main.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # The publish profile writes to _site and turns off the review overlay.
      QUARTO_PROFILE: publish
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9

      - name: Render
        run: quarto render

      # quarto publish only handles website, book, and manuscript projects, and
      # this is a default project, so push the rendered _site folder directly.
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          enable_jekyll: false
          commit_message: Publish site
